name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff black
      - run: ruff check python tests benchmarks
      - run: black --check python tests benchmarks
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Run cargo test
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib
        run: cargo test

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          container: off
      - run: sudo apt-get install -y libgsl-dev  # needed to build Corrfunc
      - run: pip install dist/pysauce-*.whl pytest pytest-cov Corrfunc
      - run: pytest --cov=pysauce --cov-report=term-missing
