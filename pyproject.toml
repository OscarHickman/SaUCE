[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pysauce"
dynamic = ["version"]
description = "Sparse and Unbiased Clustering Estimator: pair and N-point counts for sparse partitions of periodic boxes"
authors = [
    { name = "Oscar Hickman", email = "oscar.hickman17@alumni.imperial.ac.uk" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov", "Corrfunc"]
benchmark = ["pytest>=7", "pytest-benchmark"]
examples = ["matplotlib>=3.8", "jupyter"]

[project.urls]
Homepage = "https://github.com/OscarHickman/SaUCE"
Repository = "https://github.com/OscarHickman/SaUCE"
"Bug Tracker" = "https://github.com/OscarHickman/SaUCE/issues"

[tool.maturin]
python-source = "python"
module-name = "pysauce._pysauce"
features = ["pyo3/extension-module"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
